[package]
name = "auxctrl-rust"
version = "0.1.0"
edition = "2021"
authors = ["CodeTiger"]
description = "Open-source firmware for vacuum robot GD32 communication"

[[bin]]
name = "auxctrl"
path = "src/main.rs"

[[bin]]
name = "gd32_init_test"
path = "src/bin/gd32_init_test.rs"

[lib]
name = "auxctrl_rust"
path = "src/lib.rs"

[dependencies]
serialport = "4.2"
libc = "0.2"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols for smaller binary
